name: Build macOS DMG Package

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-dmg:
    name: Build macOS App & DMG
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          brew install create-dmg || true

      - name: Build SanCapture.app and SanCapture.dmg
        run: |
          python build_mac.py

      - name: Upload DMG as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanCapture-macOS-DMG
          path: dist/SanCapture.dmg
          if-no-files-found: error

      - name: Release DMG on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SanCapture.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
